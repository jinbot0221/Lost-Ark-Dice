function heading(k,title,desc){return `<div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p>`}
function render(){document.getElementById('app').classList.toggle('reduced',settings[2]);document.getElementById('app').innerHTML=`<header class="top"><div class="brand">ARKESIA<small>BLUE MARBLE</small></div><div class="balance">◈ ${gold.toLocaleString()} <span class="small">G</span></div></header><div class="demo"><span>UI PROTOTYPE · 예시 데이터</span><select aria-label="화면 바로가기" onchange="go(+this.value)">${pages.map((p,i)=>`<option value="${i}" ${i===page?'selected':''}>M-${String(i+1).padStart(3,'0')} ${p}</option>`).join('')}</select></div><main class="${page===5?'board-screen':'content'}">${screen()}</main><nav class="nav" aria-label="하단 탐색">${[['⌂','홈',0],['♧','영웅',2],['⚑','편성',3],['◇','시너지',4],['⚙','설정',10]].map(([icon,t,n])=>`<button class="${page===n?'active':''}" onclick="go(${n})"><b>${icon}</b>${t}</button>`).join('')}</nav>`}
function screen(){switch(page){case 0:return `<div class="hero-intro"><div class="row"><span class="eyebrow">CHRONICLES OF ARKESIA</span><span class="pill">SEASON 01</span></div><h1>잊혀진 길 위에,<br>다시 모이는 영웅들</h1><p class="sub">작은 주사위 하나가 써 내려가는 모험의 연대기.<br>동료들과 함께, 아크라시아의 길을 걸어보세요.</p></div><div class="landscape" role="img" aria-label="숲과 고대 유적이 있는 판타지 보드 배경"><div class="sun"></div><div class="mount"></div><div class="mount front"></div><div class="castle"></div><div class="scene-label">✧  THE FORGOTTEN GARDEN  ✧</div></div><button class="match" onclick="go(1)"><strong>모험의 문을 열다 <span style="float:right;font-size:21px;margin:0">↗</span></strong><span>2–4인 친구 대전 · 방을 만들거나 참여하세요</span></button><div class="section row"><h2>모험을 준비하세요</h2><span class="small">나만의 전략으로</span></div><div class="two"><button class="panel" onclick="go(3)"><div class="icon">⚑</div><h3>나의 원정대</h3><span class="small">영웅 3인 편성 →</span></button><button class="panel" onclick="go(4)"><div class="icon">◇</div><h3>시너지 도감</h3><span class="small">함께할수록 강하게 →</span></button></div><div class="notice row"><span>✦ 32개의 땅에 펼쳐지는 모험</span><button class="close" onclick="go(5)">보드 미리보기 →</button></div>`;
case 1:return heading('GATHER YOUR PARTY','함께 떠날 준비','친구를 초대하고 모험을 시작하세요.')+`<div class="panel"><div class="small">개발용 방 코드 · 온라인 미연결</div><div class="row" style="margin-top:10px"><strong style="font-size:26px;letter-spacing:6px">ARK824</strong><button class="close" onclick="copyCode()">복사 ▣</button></div></div><div class="row section"><h2>원정대원</h2><span class="small">2 / 4명 · 시연 플레이어</span></div>${[0,1].map((i)=>`<div class="panel list-row"><div class="avatar">${sprite(i)}</div><div class="info"><h3>${i?'별빛모험가':'나의 모험가'} ${i?'':'<span class="pill">방장</span>'}</h3><span class="small">대표 영웅 · ${heroes[i][0]}</span></div><span class="${i||ready?'green':'gold'}">${i||ready?'✓ 준비 완료':'준비 중'}</span></div>`).join('')}<div class="panel small" style="text-align:center;padding:25px;border-style:dashed">＋ 친구를 초대하세요 · 최대 4인</div><div class="actions">${btn(ready?'준비 취소':'준비 완료','ready=!ready;render()','secondary')}${`<button class="btn" ${ready?'':'disabled'} onclick="go(5)">시연 시작 →</button>`}</div><p class="page-caption">실제 방 생성·참여는 서버 연결 후 제공됩니다.</p>`;
case 2:return heading('HERO COLLECTION','당신의 영웅을 만나세요','함께할 영웅을 모으고, 새로운 전략을 발견하세요.')+`<input placeholder="영웅 이름 검색" aria-label="영웅 검색" value="${search}" oninput="search=this.value;updateHeroes()"><div class="filters">${['전체','보유','미보유','성','암','화','수','토','뇌'].map(t=>`<button class="${filter===t?'selected':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}</div><div class="hero-grid" id="hero-results">${heroResults()}</div><p class="page-caption">영웅 능력·일러스트는 개발용 예시입니다.</p>`;
case 3:return heading('YOUR EXPEDITION','나의 원정대','영웅을 눌러 교체하고, 대표 영웅을 지정하세요.')+`<div class="slots">${team.map((i,s)=>`<div>${heroCard(i,`chooseSlot(${s})`,rep===i?'★ 대표 영웅':heroes[i][1])}<div class="team-info"><button class="close" style="font-size:10px;min-height:30px" onclick="rep=${i};render()">${rep===i?'보드 위의 나의 말':'대표로 지정'}</button></div></div>`).join('')}</div><div class="section row"><h2>활성 시너지</h2><span class="pill">1개 선택</span></div><div class="panel"><div class="row"><h3>◇ 모험의 동행</h3><span class="green">${team.filter(i=>i<3).length} / 3</span></div><p style="font-size:11px;margin-bottom:0">개발용 시너지 · ${team.filter(i=>i<3).length===3?'3인 효과: 시작 보너스 +10%':'2인 효과: 시작 보너스 +5%'}</p></div><div class="section row"><h2>보유 영웅</h2><span class="small">${owned.length}명</span></div><div class="hero-grid">${owned.map(i=>heroCard(i,`toast('위 편성 슬롯을 누르면 교체할 수 있어요')`)).join('')}</div><div style="margin-top:20px">${btn('이 편성으로 준비하기 →',"toast('현재 세션에 편성을 저장했어요');go(1)")}</div>`;
case 4:return heading('CARD SET SYNERGY','함께할 때 더 강하게','카드 세트의 연결을 발견하고 효과를 확인하세요.')+`<div class="panel row"><div><div class="small">시너지 수집 현황</div><h2 style="margin:7px 0 0">1 <span class="small">/ 2 개발 예시</span></h2></div><span style="font-size:32px;color:var(--gold)">◇</span></div><input placeholder="세트 이름 검색" aria-label="시너지 검색" oninput="document.querySelectorAll('.set').forEach(e=>e.hidden=!e.dataset.name.includes(this.value))"><div style="height:18px"></div>${[['모험의 동행',[0,1,2],'시작 보너스 +5%','시작 보너스 +10%'],['전설의 발자취',[3,4,5],'전투 기본 공격 +3%','전투 기본 공격 +5%']].map(([name,ids,e2,e3])=>`<div class="set" data-name="${name}"><div class="row"><h3>${name}</h3><span class="pill">미검증 · 예시</span></div><div class="members">${ids.map(i=>`<div style="text-align:center"><div class="avatar" style="opacity:${owned.includes(i)?1:.35}">${sprite(i)}</div><span class="small">${heroes[i][0]}</span></div>`).join('')}</div><div class="progress"><i style="width:${ids.filter(i=>owned.includes(i)).length/3*100}%"></i></div><div class="effect">2인 · ${e2}</div><div class="effect gold">3인 · ${e3} (2인 효과 대체)</div></div>`).join('')}<p class="page-caption">원작 카드 세트 데이터는 미연동입니다. 위 명칭·효과는 UI 검토용입니다.</p>`;
case 5:return boardScreen();
case 6:return heading('YOUR NEXT TERRITORY','새로운 땅의 주인이 되세요','영지를 구매하고 나만의 영역을 넓혀보세요.')+propertyContent(selectedTile,false);
case 7:return heading('A TWIST OF FATE','운명이 당신을 부릅니다','예측할 수 없는 행운이 모험을 바꿉니다.')+`<button class="card-back" onclick="flipCard()" aria-label="운명의 카드 뒤집기"><span class="symbol">${flipped?'✦':'◇'}</span><h2>${flipped?'모코코의 선물':'FATE'}</h2><p style="font-size:11px;margin-top:15px">${flipped?'매치 골드 +150 G':'카드를 탭해 운명을 확인하세요'}</p></button>${btn(flipped?'보드로 돌아가기':'카드 뒤집기',flipped?'go(5)':'flipCard()')}<p class="page-caption" style="text-align:center">로컬 시연 결과 · 실제 서버 추첨 미연동</p>`;
case 8:return battleScreen();
case 9:return `<div style="text-align:center">${heading('THE END OF AN ADVENTURE','당신의 모험이 빛났습니다','예시 결과 · 실제 경기 정산이 아닙니다.')}<div style="font-size:62px;color:var(--gold);margin:18px">♜</div><h2 class="gold">1위 · 나의 모험가</h2><span class="pill">모험의 개척자</span></div><div class="panel" style="margin-top:25px"><div class="row"><span class="small">예시 계정 골드 보상</span><strong class="gold">＋ 350 G</strong></div><p class="small" style="margin:8px 0 0">시안에서는 실제 잔액에 지급하지 않습니다.</p></div>${['나의 모험가','별빛모험가','모코코친구','새벽의검'].map((n,i)=>`<div class="ranking"><b>0${i+1}</b><div class="avatar">${sprite(i)}</div><div style="flex:1"><h3>${n}</h3><span class="small">영지 ${8-i*2}개 · 전투 ${3-i}승</span></div><strong>${[4250,3180,2340,1260][i].toLocaleString()}<span class="small"> G</span></strong></div>`).join('')}<div class="actions">${btn('홈으로','go(0)','secondary')}${btn('다시 모험하기','go(1)')}</div>`;
case 10:return heading('MAKE IT YOURS','모험가의 설정','편안한 플레이를 위한 나만의 환경.')+`<div class="panel">${['효과음','진동','모션 축소','저사양 모드'].map((t,i)=>`<div class="setting"><span>${t}</span><button class="toggle ${settings[i]?'on':''}" role="switch" aria-label="${t}" aria-checked="${settings[i]}" onclick="settings[${i}]=!settings[${i}];render();${i===2?'':`toast('시안 설정입니다. 실제 장치 효과는 미연결이에요')`}"></button></div>`).join('')}</div><div class="section row"><h2>원정대 채팅</h2><span class="pill">로컬 시연</span></div><div class="panel"><div class="chat-log" id="chat-log"><div class="gold">시스템 · 모험을 준비하세요.</div><div>별빛모험가 · 안녕하세요! 좋은 모험 해요.</div>${chat.map(c=>`<div>나 · ${escapeHtml(c)}</div>`).join('')}</div><form class="row" onsubmit="event.preventDefault();sendChat(this)"><input name="message" aria-label="채팅 메시지" placeholder="메시지 입력" maxlength="200" required><button class="close" type="submit">전송</button></form></div><div class="row"><button class="close" onclick="toast('온라인 연결 후 신고 기능이 제공됩니다')">신고</button><button class="close" onclick="toast('온라인 연결 후 차단 기능이 제공됩니다')">차단</button><button class="close" onclick="go(9)">예시 결과 보기 →</button></div><p class="page-caption">사운드·진동·저사양 모드·신고/차단은 UI 시연입니다.</p>`;
}}
function heroResults(){return heroes.map((h,i)=>({h,i})).filter(({h,i})=>h[0].includes(search)&&(filter==='전체'||filter==='보유'&&owned.includes(i)||filter==='미보유'&&!owned.includes(i)||h[1].includes(filter))).map(({i})=>heroCard(i,`heroDetail(${i})`)).join('')||'<p>일치하는 영웅이 없습니다.</p>'}
function updateHeroes(){document.getElementById('hero-results').innerHTML=heroResults()}
function sheet(html){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="상세 정보"><div class="handle"></div><div style="text-align:right"><button class="close" onclick="closeSheet()" aria-label="닫기">✕</button></div>${html}</section></div>`;document.querySelector('.sheet button')?.focus()}
function closeSheet(){document.getElementById('modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'&&document.querySelector('.sheet')){const a=[...document.querySelectorAll('.sheet button:not(:disabled),.sheet input')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
function chooseSlot(slot){sheet(`<h2>영웅 교체 · 슬롯 ${slot+1}</h2><p>서로 다른 영웅 3명을 편성하세요.</p><div class="hero-grid">${owned.map(i=>heroCard(i,`swapHero(${slot},${i})`,team.includes(i)?'편성 중':heroes[i][1])).join('')}</div>`)}
function swapHero(s,i){let prior=team[s],idx=team.indexOf(i);if(idx>=0)team[idx]=prior;team[s]=i;if(!team.includes(rep))rep=i;closeSheet();render()}
function heroDetail(i){sheet(`${heroCard(i,'',heroes[i][1])}<h2 style="margin-top:15px">${heroes[i][0]}</h2><p>${heroes[i][1]} 속성 · 개발용 영웅 데이터<br>보드와 전투에서 함께할 원정대원입니다.</p>${owned.includes(i)?btn('편성하러 가기','go(3)'): `<button class="btn" ${gold<2000?'disabled':''} onclick="buyHero(${i})">2,000 계정 G · 해금하기</button>`}`)}
function buyHero(i){if(owned.includes(i)||gold<2000)return;gold-=2000;owned.push(i);closeSheet();render();toast('현재 세션에서 영웅이 해금되었어요')}
function boardScreen(){return `<div class="row"><span class="eyebrow">THE WORLD IS YOURS</span><span class="pill">TURN ${String(round).padStart(2,'0')} / 30</span></div><div class="players">${['나의 모험가','별빛모험가','모코코친구','새벽의검'].map((n,i)=>`<div class="player ${i===0?'current':''}">${sprite(i===0?rep:i)}<div><strong>${n} ${i===0?'· 내 턴':''}</strong><span class="gold">◈ ${i===0?money.toLocaleString():[0,1800,2240,1560][i].toLocaleString()} G</span></div></div>`).join('')}</div><div class="board-wrap"><div class="board" style="${zoom?'width:650px;':''}"><div class="center"><div class="compass">✥</div><h2>ARKESIA</h2><small>BLUE MARBLE</small><div class="turn">${heroes[rep][0]}과 함께하는 모험</div></div>${tiles.map((name,i)=>{let r,c;if(i<=8){r=9;c=9-i}else if(i<=16){r=17-i;c=1}else if(i<=24){r=1;c=i-15}else{r=i-23;c=9}let event=[15,23,31].includes(i);return `<button aria-label="${i}번 ${name}${prices[i]?' '+prices[i]+' 골드':''}" class="tile ${!prices[i]?'special':''} ${event?'event':''}" style="grid-row:${r};grid-column:${c};--stripe:${properties[i]?'#e5b85d':['#ff9a9e','#71caff','#b89af4','#78d9ac'][Math.floor(i/8)]}" onclick="inspectTile(${i})"><span>${event?'◇':name}</span>${prices[i]?`<span class="price">${prices[i]} G${properties[i]?' · ★'+properties[i]:''}</span>`:''}${i===pos?sprite(rep):''}${i===9?sprite(1):''}${i===17?sprite(2):''}${i===25?sprite(3):''}</button>`}).join('')}</div></div><div class="board-controls"><span>32 TILES · 대표 영웅 SD 말</span><button onclick="zoom=!zoom;render()">${zoom?'⊖ 전체 보기':'⊕ 확대 / 드래그'}</button></div><div class="panel dice-panel"><div class="row"><span class="small green">● 나의 턴 · 로컬 시연</span><span class="small">${tiles[pos]}</span></div><div><span class="dice" aria-label="주사위 ${dice[0]}">${['','⚀','⚁','⚂','⚃','⚄','⚅'][dice[0]]}</span><span class="dice" aria-label="주사위 ${dice[1]}">${['','⚀','⚁','⚂','⚃','⚄','⚅'][dice[1]]}</span></div>${btn('주사위 굴리기  ↗','roll()')}<div class="turn-line">당신의 다음 모험은 어디인가요?</div></div><div class="row"><button class="close" onclick="go(8)">⚔ 전투 미리보기</button><button class="close" onclick="go(10)">☷ 게임 로그 / 채팅</button></div>`}
function inspectTile(i){selectedTile=i;if(prices[i])sheet(propertyContent(i,true));else if([15,23,31].includes(i)){flipped=false;go(7)}else toast(tiles[i]+' · 특수 칸 효과는 아직 미연동입니다')}
function propertyContent(i,isSheet){let level=properties[i]||0;return `<div class="property-art"><div class="castle"></div></div><div class="row"><h2>${tiles[i]}</h2><span class="pill">${level?'나의 영지 · '+level+'단계':'주인 없는 영지'}</span></div><p>당신의 모험을 이곳에서 이어가세요.</p><div class="stat-row"><span>보유 매치 골드</span><strong>${money.toLocaleString()} G</strong></div><div class="stat-row"><span>${level?'건설 비용':'구매 가격'}</span><strong>${Math.round(prices[i]*(level?.5:1))} G</strong></div><div class="stat-row"><span>현재 통행료 → 예상 통행료</span><strong>${Math.round(prices[i]*level*.2)} → ${Math.round(prices[i]*(level+1)*.2)} G</strong></div><div class="actions">${btn('취소',isSheet?'closeSheet()':'go(5)','ghost')}<button class="btn" ${money<Math.round(prices[i]*(level?.5:1))||level>=3?'disabled':''} onclick="buyProperty(${i},${isSheet})">${level>=3?'최대 건설':level?'건설하기':'영지 구매'}</button></div><p class="page-caption">로컬 구매 시연 · 통행료는 UI 예시 산식입니다.</p>`}
function buyProperty(i,isSheet){let l=properties[i]||0,c=Math.round(prices[i]*(l?.5:1));if(l>=3||money<c)return;money-=c;properties[i]=l+1;if(isSheet)closeSheet();else page=5;render();toast(tiles[i]+' '+(l?'건설 완료':'구매 완료'))}
function roll(){dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];let old=pos;pos=(pos+dice[0]+dice[1])%32;round++;if(pos<old)money+=200;render();if([15,23,31].includes(pos)){flipped=false;go(7)}else if(prices[pos]){selectedTile=pos;sheet(propertyContent(pos,true))}else toast(dice.join(' + ')+' · '+tiles[pos]+' 도착')}
function flipCard(){if(flipped)return;flipped=true;money+=150;render()}
function battleScreen(){return heading('A FATEFUL ENCOUNTER','운명의 조우','같은 칸에서 만난 두 원정대 · 전투 시연')+`<div class="row"><span class="green">나의 원정대</span><span class="small">ROUND 01 / 06</span><span style="color:#d7a1a7">별빛 원정대</span></div><div class="battle-field"><span class="vs">VS</span>${[0,1,2,3,4,5].map((i)=>`<div class="fighter" style="left:${i<3?[9,31,19][i]:[66,80,63][i-3]}%;top:${i<3?[129,166,33][i]:[29,108,169][i-3]}px">${sprite(i)}<small>${heroes[i][0]}</small><div class="hp"><i style="width:${i<3?100:battleHp}%;${i<3?'':'background:#c98792'}"></i></div></div>`).join('')}</div><div class="panel"><div class="row"><h3>아만의 행동</h3><span class="gold">에너지 ${energy} / 3</span></div><p class="small">주사위를 굴린 뒤 사용할 스킬을 선택하세요.</p><div style="text-align:center">${battleRolled?`<span class="dice">${dice[0]}</span><span class="dice">${dice[1]}</span>`:''}</div>${battleRolled?`<div class="skills">${[['기본 공격',2],['빛의 일격',5],['성역의 빛',8]].map(([n,min])=>`<button ${dice[0]+dice[1]<min?'disabled':''} onclick="chooseTarget('${n}')">${n}<small>합계 ${min} 이상</small></button>`).join('')}</div>`:btn('전투 주사위 굴리기','battleRoll()')}<p class="small" style="margin-bottom:0">${battleHp===100?'전투 로그 · 스킬과 대상을 선택해 보세요.':'전투 로그 · 예시 피해 35 적용, 상대 HP '+battleHp+'%'}</p></div>${btn('보드로 돌아가기','go(5)','ghost')}<p class="page-caption">전투 수치·스킬은 UI 시연용이며 전체 판정 규칙은 미연결입니다.</p>`}
function battleRoll(){dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];energy=Math.min(3,energy+1+(dice[0]===dice[1]?1:0));battleRolled=true;render()}
function chooseTarget(skill){sheet(`<h2>${skill} · 대상 선택</h2><p>공격할 상대 영웅을 선택하세요.</p><div class="hero-grid">${[3,4,5].map(i=>heroCard(i,`attack('${heroes[i][0]}')`)).join('')}</div>`)}
function attack(name){battleHp=Math.max(0,battleHp-35);battleRolled=false;closeSheet();render();toast(name+'에게 예시 피해 35'+(battleHp===0?' · 시연 전투 종료':''));if(!battleHp){battleHp=100;setTimeout(()=>go(9),1000)}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sendChat(form){let m=form.elements.message.value.trim();if(!m)return;chat.push(m);render();document.getElementById('chat-log').scrollTop=99999}
async function copyCode(){try{await navigator.clipboard.writeText('ARK824');toast('시연 방 코드를 복사했어요')}catch{toast('시연 방 코드: ARK824')}}
render();
</script></body></html>
